# Two services off the same image: the investigator dashboard and the API that
# the complaint feed posts to. Neither needs a database or Redis to start.
services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Set ETHERSCAN_API_KEY and drop CHAINTRACE_OFFLINE to use live data.
      CHAINTRACE_OFFLINE: "1"
      CHAINTRACE_DB: /data/chaintrace.db
    volumes:
      - chaintrace-data:/data

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      CHAINTRACE_OFFLINE: "1"
      CHAINTRACE_DB: /data/chaintrace.db
    volumes:
      - chaintrace-data:/data

volumes:
  chaintrace-data:
